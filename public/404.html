<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Altersvorsorge-Simulator</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 queries back to root path while preserving hash
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body>
    <p>Weiterleitung...</p>
  </body>
</html>
